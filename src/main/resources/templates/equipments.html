<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title th:text="${title + ' | ' + site.title}">我的装备</title>
        <link rel="icon" th:if="${not #strings.isEmpty(site.favicon)}" th:href="${site.favicon}" />
        <th:block th:replace="~{plugin:han-equipment:modules/style}"></th:block>
    </head>
    <body class="equipment-page">
        <main class="equipment-page-main">
            <header class="equipment-page-header">
                <p>MY EVERYDAY GEAR</p>
                <h1 th:text="${title}">我的装备</h1>
                <div>陪伴日常的设备，以及它们背后的配置。</div>
            </header>
            <th:block th:replace="~{plugin:han-equipment:modules/equipment :: list(groups=${groups})}"></th:block>
        </main>
    </body>
</html>
