name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v3
    permissions:
      contents: write
    with:
      ui-path: "ui"
      pnpm-version: 11
      node-version: 24
      java-version: 21
      skip-appstore-release: true
